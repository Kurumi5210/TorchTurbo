version: "2.0"

stages:
  - test

jobs:
  自定义脚本任务:
    stage: test
    component: shell-with-clone
    inputs:
      image: aci/utf-8_jdk-1.8.0_172_b245_mvn-3.2.5:20201225
      script: |
        echo hello
        ls
      cloneDepth: 1     # 指定 clone 深度, 默认是10
      cloneFetchCommitId: true # 是否开启 fetch 模式下载代码(默认是 true，下载速度快)，当值为 false 时，cloneSingleBranch 不生效
      cloneSingleBranch: false # git clone 是否开启 --single-branch，默认 false
