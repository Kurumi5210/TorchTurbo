engine_config:
  parallel_plan:
    sp_size: 8
    ep_size: 8
  gbs: 32

  freeze_policy:
    vision_tower: true
    multi_modal_projector: true

  activation_checkpointing:
    enabled: true
    use_reentrant: true

  loss_chunk:
    enabled: true

  moe:
    aux_loss_coeff: 1.0e-6

  mfu:
    enabled: true

  ops:
    overrides:
      causal_conv1d: fla_causal_conv1d

  optimizer:
    name: muon
    muon:
      lr: 2.5e-5
      weight_decay: 0.01
      momentum: 0.9
      nesterov: false
      ns_steps: 5
      ns_coefficients:
        - [4.0848, -6.8946, 2.9270]
        - [3.9505, -6.3029, 2.6377]
        - [3.7418, -5.5913, 2.3037]
        - [2.8769, -3.1427, 1.2046]
        - [2.8366, -3.0525, 1.2012]
      adamw_betas: [0.9, 0.95]
      adamw_eps: 1.0e-8
      adamw_lr: 1.0e-5
